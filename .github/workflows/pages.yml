# Tests, then publishes the static site to https://jmelis.github.io/calc/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # no floating major tag
      - run: uv sync
      - run: uv run python tools/build_bundle.py
      # test_latex.py runs latex.js with the runner's preinstalled node; test_bundle.py
      # checks the bundles built above
      - run: uv run pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3 # no floating major tag
      - name: Collect the site (only what the browser loads)
        run: |
          mkdir -p _site/py/calc
          cp index.html app.css app.js latex.js backend.js worker.js _site/
          cp py/calc/*.py _site/py/calc/
          uv run --no-project python tools/build_bundle.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
